[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-train"
version = "0.1.0"
description = "Reproducible small-model SFT and RL smoke experiments"
requires-python = ">=3.11"

[project.scripts]
nano-train = "nano_train.cli:main"

[tool.setuptools.packages.find]
include = ["nano_train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
